<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nail Upp</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #fff7fb;
  color: #333;
}

header {
  background: #d81b60;
  color: white;
  text-align: center;
  padding: 35px 15px;
  border-radius: 0 0 30px 30px;
}

header h1 {
  font-size: 34px;
}

header p {
  margin-top: 8px;
}

.container {
  max-width: 650px;
  margin: auto;
  padding: 25px 15px;
}

.card {
  background: white;
  padding: 25px;
  border-radius: 20px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

h2 {
  color: #d81b60;
  margin-bottom: 20px;
  text-align: center;
}

.option {
  width: 100%;
  border: none;
  border-radius: 30px;
  padding: 16px;
  margin-top: 12px;
  background: #d81b60;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.option:hover {
  opacity: 0.9;
}

.back {
  background: #555;
}

.form {
  display: none;
}

label {
  display: block;
  font-weight: bold;
  margin-top: 12px;
  margin-bottom: 6px;
}

input,
textarea {
  width: 100%;
  padding: 13px;
  border: 1px solid #ddd;
  border-radius: 10px;
  font-size: 15px;
}

textarea {
  min-height: 80px;
}

.message {
  text-align: center;
  margin-top: 12px;
  font-weight: bold;
}
</style>
</head>

<body>

<header>
  <h1>💅 Nail Upp</h1>
  <p>Nail services, shops & products in one place</p>
</header>

<div class="container">

<!-- MAIN MENU -->

<div class="card" id="mainMenu">

  <h2>Welcome to Nail Upp</h2>

  <button class="option"
    onclick="openClient()">
    👤 Client
  </button>

  <button class="option"
    onclick="openTechnician()">
    💅 Nail Technician
  </button>

  <button class="option"
    onclick="openParlor()">
    💇 Nail Parlor
  </button>

  <button class="option"
    onclick="openShop()">
    🏪 Nail Shop
  </button>

</div>


<!-- CLIENT -->

<div class="card form" id="clientForm">

  <h2>👤 Client</h2>

  <label>Your Name</label>

  <input
    id="clientName"
    type="text"
    placeholder="Enter your name"
  >

  <label>Phone Number</label>

  <input
    id="clientPhone"
    type="tel"
    placeholder="Enter your phone number"
  >

  <button class="option"
    onclick="enterClient()">
    Continue
  </button>

  <button class="option back"
    onclick="showMain()">
    ← Back
  </button>

</div>


<!-- NAIL SHOP -->

<div class="card form" id="shopForm">

  <h2>🏪 Nail Shop</h2>

  <button class="option"
    onclick="showShopLogin()">
    🔐 Shop Login
  </button>

  <button class="option"
    onclick="showShopRegister()">
    ➕ Register Nail Shop
  </button>

  <button class="option back"
    onclick="showMain()">
    ← Back
  </button>

</div>


<!-- SHOP LOGIN -->

<div class="card form" id="shopLogin">

  <h2>🔐 Nail Shop Login</h2>

  <label>Shop Phone Number</label>

  <input
    id="loginPhone"
    type="tel"
    placeholder="Enter shop phone"
  >

  <label>Password</label>

  <input
    id="loginPassword"
    type="password"
    placeholder="Enter password"
  >

  <button class="option"
    onclick="loginShop()">
    🔐 Login
  </button>

  <p id="loginMessage"
     class="message"></p>

  <button class="option back"
    onclick="openShop()">
    ← Back
  </button>

</div>


<!-- SHOP REGISTER -->

<div class="card form" id="shopRegister">

  <h2>🏪 Register Nail Shop</h2>

  <label>Shop Name</label>

  <input
    id="registerName"
    type="text"
    placeholder="Example: Beauty Nails"
  >

  <label>Phone Number</label>

  <input
    id="registerPhone"
    type="tel"
    placeholder="Enter shop phone"
  >

  <label>Location</label>

  <input
    id="registerLocation"
    type="text"
    placeholder="Example: Kireka"
  >

  <label>About Your Shop</label>

  <textarea
    id="registerAbout"
    placeholder="Tell customers about your shop"
  ></textarea>

  <label>Password</label>

  <input
    id="registerPassword"
    type="password"
    placeholder="Create password"
  >

  <label>Confirm Password</label>

  <input
    id="registerPassword2"
    type="password"
    placeholder="Confirm password"
  >

  <button class="option"
    onclick="registerShop()">
    🏪 Create Shop Account
  </button>

  <p id="registerMessage"
     class="message"></p>

  <button class="option back"
    onclick="openShop()">
    ← Back
  </button>

</div>

</div>


<script>

/* HIDE ALL FORMS */

function hideAll() {

  document.getElementById(
    "mainMenu"
  ).style.display = "none";

  document.getElementById(
    "clientForm"
  ).style.display = "none";

  document.getElementById(
    "shopForm"
  ).style.display = "none";

  document.getElementById(
    "shopLogin"
  ).style.display = "none";

  document.getElementById(
    "shopRegister"
  ).style.display = "none";

}


/* MAIN MENU */

function showMain() {

  hideAll();

  document.getElementById(
    "mainMenu"
  ).style.display = "block";

}


/* CLIENT */

function openClient() {

  hideAll();

  document.getElementById(
    "clientForm"
  ).style.display = "block";

}


function enterClient() {

  const name =
    document.getElementById(
      "clientName"
    ).value.trim();

  const phone =
    document.getElementById(
      "clientPhone"
    ).value.trim();

  if (!name || !phone) {

    alert(
      "Please enter your name and phone number."
    );

    return;
  }

  localStorage.setItem(
    "nailUppName",
    name
  );

  localStorage.setItem(
    "nailUppPhone",
    phone
  );

  window.location.href =
    "client.html";
}


/* TECHNICIAN */

function openTechnician() {

  window.location.href =
    "technician.html";

}


/* PARLOR */

function openParlor() {

  window.location.href =
    "parlor.html";

}


/* NAIL SHOP */

function openShop() {

  hideAll();

  document.getElementById(
    "shopForm"
  ).style.display = "block";

}


/* SHOP LOGIN */

function showShopLogin() {

  hideAll();

  document.getElementById(
    "shopLogin"
  ).style.display = "block";

}


/* SHOP REGISTRATION */

function showShopRegister() {

  hideAll();

  document.getElementById(
    "shopRegister"
  ).style.display = "block";

}


/* REGISTER SHOP */

function registerShop() {

  const name =
    document.getElementById(
      "registerName"
    ).value.trim();

  const phone =
    document.getElementById(
      "registerPhone"
    ).value.trim();

  const location =
    document.getElementById(
      "registerLocation"
    ).value.trim();

  const about =
    document.getElementById(
      "registerAbout"
    ).value.trim();

  const password =
    document.getElementById(
      "registerPassword"
    ).value;

  const password2 =
    document.getElementById(
      "registerPassword2"
    ).value;


  if (
    !name ||
    !phone ||
    !location ||
    !password
  ) {

    alert(
      "Please fill in all required fields."
    );

    return;
  }


  if (password.length < 4) {

    alert(
      "Password must be at least 4 characters."
    );

    return;
  }


  if (password !== password2) {

    alert(
      "Passwords do not match."
    );

    return;
  }


  const saved =
    localStorage.getItem(
      "nailUppRegisteredShops"
    );


  const shops =
    saved
      ? JSON.parse(saved)
      : [];


  const existing =
    shops.find(
      function(shop) {
        return shop.phone === phone;
      }
    );


  if (existing) {

    alert(
      "A shop with this phone number already exists."
    );

    return;
  }


  const shop = {

    id:
      "SHOP-" + Date.now(),

    name:
      name,

    phone:
      phone,

    location:
      location,

    about:
      about,

    password:
      password

  };


  shops.push(shop);


  localStorage.setItem(
    "nailUppRegisteredShops",
    JSON.stringify(shops)
  );


  localStorage.setItem(
    "nailUppShop",
    JSON.stringify(shop)
  );


  alert(
    "Nail Shop registered successfully!"
  );


  window.location.href =
    "shop.html";

}


/* SHOP LOGIN */

function loginShop() {

  const phone =
    document.getElementById(
      "loginPhone"
    ).value.trim();

  const password =
    document.getElementById(
      "loginPassword"
    ).value;


  const saved =
    localStorage.getItem(
      "nailUppRegisteredShops"
    );


  const shops =
    saved
      ? JSON.parse(saved)
      : [];


  const shop =
    shops.find(
      function(item) {

        return (
          item.phone === phone &&
          item.password === password
        );

      }
    );


  if (!shop) {

    document.getElementById(
      "loginMessage"
    ).textContent =
      "❌ Incorrect phone number or password.";

    return;
  }


  localStorage.setItem(
    "nailUppShop",
    JSON.stringify(shop)
  );


  window.location.href =
    "shop.html";

}


/* START */

showMain();

</script>

</body>
</html>
