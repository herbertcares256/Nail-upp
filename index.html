<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nail Upp</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #fff7fb;
  color: #333;
}

header {
  background: #d81b60;
  color: white;
  text-align: center;
  padding: 35px 15px;
  border-radius: 0 0 30px 30px;
}

header h1 {
  font-size: 34px;
}

header p {
  margin-top: 8px;
}

.container {
  max-width: 600px;
  margin: auto;
  padding: 25px 15px;
}

.card {
  background: white;
  padding: 22px;
  border-radius: 20px;
  margin-bottom: 20px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

h2 {
  color: #d81b60;
  margin-bottom: 15px;
}

label {
  display: block;
  font-weight: bold;
  margin-top: 12px;
  margin-bottom: 6px;
}

input,
textarea {
  width: 100%;
  padding: 13px;
  border: 1px solid #ddd;
  border-radius: 10px;
  font-size: 15px;
}

textarea {
  min-height: 80px;
}

button {
  width: 100%;
  border: none;
  border-radius: 25px;
  padding: 14px;
  margin-top: 15px;
  background: #d81b60;
  color: white;
  font-size: 16px;
  font-weight: bold;
}

.secondary {
  background: #555;
}

.message {
  text-align: center;
  margin-top: 12px;
  font-weight: bold;
}

.hidden {
  display: none;
}

.divider {
  text-align: center;
  margin: 20px 0;
  color: #888;
}
</style>
</head>

<body>

<header>
  <h1>💅 Nail Upp</h1>
  <p>Nail services, shops & products in one place</p>
</header>

<div class="container">

  <!-- MAIN MENU -->

  <div class="card" id="mainMenu">

    <h2>Welcome to Nail Upp</h2>

    <button onclick="showClientLogin()">
      👤 Client
    </button>

    <button onclick="showShopLogin()">
      🏪 Nail Shop
    </button>

  </div>


  <!-- CLIENT LOGIN -->

  <div class="card hidden" id="clientLogin">

    <h2>👤 Client</h2>

    <label>Your Name</label>

    <input
      id="clientName"
      type="text"
      placeholder="Enter your name"
    >

    <label>Phone Number</label>

    <input
      id="clientPhone"
      type="tel"
      placeholder="Enter your phone number"
    >

    <button onclick="enterClient()">
      Continue
    </button>

    <button
      class="secondary"
      onclick="showMainMenu()">
      ← Back
    </button>

  </div>


  <!-- SHOP LOGIN -->

  <div class="card hidden" id="shopLogin">

    <h2>🏪 Nail Shop Login</h2>

    <label>Shop Phone Number</label>

    <input
      id="loginPhone"
      type="tel"
      placeholder="Enter shop phone"
    >

    <label>Password</label>

    <input
      id="loginPassword"
      type="password"
      placeholder="Enter password"
    >

    <button onclick="shopLoginSubmit()">
      🔐 Login
    </button>

    <p id="loginMessage" class="message"></p>

    <div class="divider">
      Don't have a shop account?
    </div>

    <button onclick="showShopRegister()">
      ➕ Register Nail Shop
    </button>

    <button
      class="secondary"
      onclick="showMainMenu()">
      ← Back
    </button>

  </div>


  <!-- SHOP REGISTRATION -->

  <div class="card hidden" id="shopRegister">

    <h2>🏪 Register Nail Shop</h2>

    <label>Shop Name</label>

    <input
      id="registerName"
      type="text"
      placeholder="Example: Beauty Nails"
    >

    <label>Phone Number</label>

    <input
      id="registerPhone"
      type="tel"
      placeholder="Enter shop phone"
    >

    <label>Location</label>

    <input
      id="registerLocation"
      type="text"
      placeholder="Example: Kireka"
    >

    <label>About Your Shop</label>

    <textarea
      id="registerAbout"
      placeholder="Tell customers about your shop"
    ></textarea>

    <label>Password</label>

    <input
      id="registerPassword"
      type="password"
      placeholder="Create a password"
    >

    <label>Confirm Password</label>

    <input
      id="registerPassword2"
      type="password"
      placeholder="Confirm your password"
    >

    <button onclick="registerShop()">
      🏪 Create Shop Account
    </button>

    <p id="registerMessage" class="message"></p>

    <button
      class="secondary"
      onclick="showShopLogin()">
      ← Back to Login
    </button>

  </div>

</div>


<script>

/* SHOW MAIN MENU */

function showMainMenu() {

  hideAll();

  document.getElementById(
    "mainMenu"
  ).classList.remove("hidden");

}


/* CLIENT LOGIN */

function showClientLogin() {

  hideAll();

  document.getElementById(
    "clientLogin"
  ).classList.remove("hidden");

}


/* SHOP LOGIN */

function showShopLogin() {

  hideAll();

  document.getElementById(
    "shopLogin"
  ).classList.remove("hidden");

}


/* SHOP REGISTER */

function showShopRegister() {

  hideAll();

  document.getElementById(
    "shopRegister"
  ).classList.remove("hidden");

}


/* HIDE ALL */

function hideAll() {

  document.getElementById(
    "mainMenu"
  ).classList.add("hidden");

  document.getElementById(
    "clientLogin"
  ).classList.add("hidden");

  document.getElementById(
    "shopLogin"
  ).classList.add("hidden");

  document.getElementById(
    "shopRegister"
  ).classList.add("hidden");

}


/* CLIENT */

function enterClient() {

  const name =
    document.getElementById(
      "clientName"
    ).value.trim();

  const phone =
    document.getElementById(
      "clientPhone"
    ).value.trim();


  if (!name || !phone) {

    alert(
      "Please enter your name and phone number."
    );

    return;
  }


  localStorage.setItem(
    "nailUppName",
    name
  );

  localStorage.setItem(
    "nailUppPhone",
    phone
  );


  window.location.href =
    "client.html";

}


/* REGISTER SHOP */

function registerShop() {

  const name =
    document.getElementById(
      "registerName"
    ).value.trim();

  const phone =
    document.getElementById(
      "registerPhone"
    ).value.trim();

  const location =
    document.getElementById(
      "registerLocation"
    ).value.trim();

  const about =
    document.getElementById(
      "registerAbout"
    ).value.trim();

  const password =
    document.getElementById(
      "registerPassword"
    ).value;

  const password2 =
    document.getElementById(
      "registerPassword2"
    ).value;


  if (
    !name ||
    !phone ||
    !location ||
    !password
  ) {

    alert(
      "Please fill in all required fields."
    );

    return;
  }


  if (password.length < 4) {

    alert(
      "Password must be at least 4 characters."
    );

    return;
  }


  if (password !== password2) {

    alert(
      "Passwords do not match."
    );

    return;
  }


  /*
    Create a unique shop ID.
  */

  const shopId =
    "SHOP-" +
    Date.now();


  const shop = {

    id:
      shopId,

    name:
      name,

    phone:
      phone,

    location:
      location,

    about:
      about,

    password:
      password

  };


  /*
    Save the shop account.
  */

  localStorage.setItem(
    "nailUppShop",
    JSON.stringify(shop)
  );


  /*
    Also save a list of registered shops.
  */

  const savedShops =
    localStorage.getItem(
      "nailUppRegisteredShops"
    );


  const shops =
    savedShops
      ? JSON.parse(savedShops)
      : [];


  shops.push(shop);


  localStorage.setItem(
    "nailUppRegisteredShops",
    JSON.stringify(shops)
  );


  alert(
    "Nail Shop registered successfully!"
  );


  /*
    Open the shop dashboard.
  */

  window.location.href =
    "shop.html";

}


/* SHOP LOGIN */

function shopLoginSubmit() {

  const phone =
    document.getElementById(
      "loginPhone"
    ).value.trim();

  const password =
    document.getElementById(
      "loginPassword"
    ).value;


  const savedShops =
    localStorage.getItem(
      "nailUppRegisteredShops"
    );


  const shops =
    savedShops
      ? JSON.parse(savedShops)
      : [];


  const shop =
    shops.find(
      function(item) {

        return (
          item.phone === phone &&
          item.password === password
        );

      }
    );


  if (!shop) {

    document.getElementById(
      "loginMessage"
    ).textContent =
      "❌ Incorrect phone number or password.";

    return;
  }


  /*
    Save the logged-in shop.
  */

  localStorage.setItem(
    "nailUppShop",
    JSON.stringify(shop)
  );


  window.location.href =
    "shop.html";

}

</script>

</body>
</html>
