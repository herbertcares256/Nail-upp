```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Orders - Nail Upp</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #fff7fb;
  color: #333;
}

header {
  background: #d9165b;
  color: white;
  text-align: center;
  padding: 28px 18px;
  border-radius: 0 0 30px 30px;
}

header h1 {
  font-size: 28px;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 20px 15px 50px;
}

.order {
  background: white;
  padding: 20px;
  border-radius: 20px;
  margin-bottom: 18px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

.order h2 {
  color: #c91b5b;
  font-size: 20px;
}

.shop {
  margin-top: 8px;
  color: #666;
}

.item {
  border-top: 1px solid #eee;
  padding: 12px 0;
  margin-top: 10px;
}

.total {
  font-size: 19px;
  font-weight: bold;
  color: #c91b5b;
  margin-top: 12px;
}

.status {
  display: inline-block;
  background: #fff0f5;
  color: #c91b5b;
  padding: 8px 14px;
  border-radius: 20px;
  font-weight: bold;
  margin-top: 12px;
}

button {
  width: 100%;
  border: none;
  border-radius: 25px;
  padding: 14px;
  margin-top: 12px;
  background: #d9165b;
  color: white;
  font-size: 16px;
  font-weight: bold;
}

.gray {
  background: #555;
}

.empty {
  background: white;
  padding: 30px;
  text-align: center;
  border-radius: 20px;
  color: #777;
}
</style>
</head>

<body>

<header>
  <h1>📦 My Orders</h1>
  <p>Track your Nail Upp orders</p>
</header>

<div class="container">

  <div id="orders">
    <div class="empty">
      Loading orders...
    </div>
  </div>

  <button class="gray" onclick="goHome()">
    ← Back to Nail Upp
  </button>

</div>

<script>

function loadOrders() {

  const saved =
    localStorage.getItem(
      "nailUppProductOrders"
    );

  const orders =
    saved
      ? JSON.parse(saved)
      : [];

  const container =
    document.getElementById(
      "orders"
    );

  if (orders.length === 0) {

    container.innerHTML =
      '<div class="empty">' +
      '<h3>No Orders Yet</h3>' +
      '<p style="margin-top:8px;">' +
      'Your product orders will appear here.' +
      '</p>' +
      '</div>';

    return;
  }

  let html = "";

  orders
    .slice()
    .reverse()
    .forEach(function(order) {

      let itemsHTML = "";

      order.items.forEach(function(item) {

        itemsHTML +=

          '<div class="item">' +

          '<strong>' +
          escapeHTML(item.name) +
          '</strong>' +

          '<br>' +

          'Quantity: ' +
          item.quantity +

          '<br>' +

          'UGX ' +
          Number(item.price)
            .toLocaleString() +

          '</div>';

      });

      html +=

        '<div class="order">' +

        '<h2>' +
        'Order #' +
        escapeHTML(String(order.id)) +
        '</h2>' +

        '<p class="shop">' +
        '🏪 ' +
        escapeHTML(
          order.shopName ||
          "Nail Shop"
        ) +
        '</p>' +

        '<p class="shop">' +
        '📅 ' +
        escapeHTML(
          order.date ||
          ""
        ) +
        '</p>' +

        itemsHTML +

        '<div class="total">' +
        'Total: UGX ' +
        Number(order.total)
          .toLocaleString() +
        '</div>' +

        '<div class="status">' +
        'Status: ' +
        escapeHTML(
          order.status ||
          "Pending"
        ) +
        '</div>' +

        '</div>';

    });

  container.innerHTML = html;
}


function escapeHTML(text) {

  return String(text)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function goHome() {

  window.location.href =
    "index.html";

}


loadOrders();

</script>

</body>
</html>
