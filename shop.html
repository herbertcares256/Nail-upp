<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nail Upp - Shop Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #fff7fb;
      color: #333;
    }

    header {
      background: #d81b60;
      color: white;
      text-align: center;
      padding: 25px 15px;
      border-radius: 0 0 25px 25px;
    }

    header h1 {
      font-size: 28px;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 20px 15px 40px;
    }

    .card {
      background: white;
      padding: 20px;
      margin-bottom: 18px;
      border-radius: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .card h2 {
      color: #d81b60;
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-top: 12px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
    }

    textarea {
      min-height: 70px;
    }

    .button {
      width: 100%;
      border: none;
      border-radius: 25px;
      padding: 14px;
      margin-top: 15px;
      background: #d81b60;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    .product {
      border: 1px solid #eee;
      border-radius: 14px;
      padding: 15px;
      margin-top: 12px;
    }

    .product-image {
      width: 100%;
      max-height: 250px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 12px;
    }

    .product h3 {
      color: #d81b60;
      margin-bottom: 8px;
    }

    .product p {
      margin: 6px 0;
      font-size: 14px;
    }

    .price {
      font-weight: bold;
      font-size: 17px;
    }

    .delete {
      background: #c62828;
      color: white;
      border: none;
      border-radius: 20px;
      padding: 9px 15px;
      margin-top: 8px;
    }

    .order {
      border: 1px solid #eee;
      border-radius: 14px;
      padding: 15px;
      margin-top: 12px;
    }

    .order-item {
      background: #fff7fb;
      padding: 10px;
      border-radius: 10px;
      margin-top: 8px;
    }

    .order-status {
      margin-top: 12px;
      padding: 12px;
      border-radius: 10px;
      background: #fff3cd;
      color: #856404;
      text-align: center;
      font-weight: bold;
    }

    .accepted {
      background: #e8f5e9;
      color: #2e7d32;
    }

    .declined {
      background: #ffebee;
      color: #c62828;
    }

    .accept {
      background: #2e7d32;
      color: white;
      border: none;
      border-radius: 20px;
      padding: 10px 18px;
      margin-top: 12px;
      margin-right: 8px;
    }

    .decline {
      background: #c62828;
      color: white;
      border: none;
      border-radius: 20px;
      padding: 10px 18px;
      margin-top: 12px;
    }

    .empty {
      color: #777;
      text-align: center;
      padding: 10px;
    }

    .logout {
      width: 100%;
      background: #333;
      color: white;
      border: none;
      border-radius: 25px;
      padding: 13px;
      font-size: 15px;
    }

    .preview {
      display: none;
      width: 100%;
      max-height: 220px;
      object-fit: cover;
      border-radius: 12px;
      margin-top: 12px;
    }
  </style>
</head>

<body>

<header>
  <h1>💅 Nail Upp</h1>
  <p>Nail Shop Dashboard</p>
</header>

<div class="container">

  <!-- SHOP PROFILE -->

  <div class="card">

    <h2>🛍️ Shop Profile</h2>

    <label>Shop Name</label>
    <input id="shopName" type="text" placeholder="Enter shop name">

    <label>Location</label>
    <input id="shopLocation" type="text" placeholder="Enter shop location">

    <label>Phone Number</label>
    <input id="shopPhone" type="tel" placeholder="Enter phone number">

    <label>About Your Shop</label>

    <textarea
      id="shopAbout"
      placeholder="Describe your nail shop"
    ></textarea>

    <button class="button" onclick="saveShop()">
      Save Shop
    </button>

  </div>


  <!-- ADD PRODUCT -->

  <div class="card">

    <h2>➕ Add Nail Product</h2>

    <label>Product Picture</label>

    <input
      id="productImage"
      type="file"
      accept="image/*"
      onchange="previewImage()"
    >

    <img
      id="preview"
      class="preview"
      alt="Product preview"
    >

    <label>Product Name</label>

    <input
      id="productName"
      type="text"
      placeholder="Example: Gel Polish"
    >

    <label>Category</label>

    <select id="category">

      <option value="">Select category</option>

      <option>Nail Polish</option>
      <option>Gel</option>
      <option>Acrylic</option>
      <option>Nail Tips</option>
      <option>Nail Tools</option>
      <option>Nail Accessories</option>
      <option>Nail Care</option>
      <option>Other</option>

    </select>

    <label>Price (UGX)</label>

    <input
      id="productPrice"
      type="number"
      placeholder="Example: 15000"
    >

    <label>Description</label>

    <textarea
      id="productDescription"
      placeholder="Describe the product"
    ></textarea>

    <button class="button" onclick="addProduct()">
      📦 Add Product
    </button>

  </div>


  <!-- PRODUCTS -->

  <div class="card">

    <h2>📦 My Products</h2>

    <div id="products">
      <p class="empty">No products added yet.</p>
    </div>

  </div>


  <!-- CUSTOMER ORDERS -->

  <div class="card">

    <h2>🛒 Customer Orders</h2>

    <div id="orders">
      <p class="empty">No customer orders yet.</p>
    </div>

  </div>


  <button class="logout" onclick="logout()">
    Log Out
  </button>

</div>


<script>

let selectedImage = "";


/* SHOP PROFILE */

function saveShop() {

  const name =
    document.getElementById("shopName").value.trim();

  const location =
    document.getElementById("shopLocation").value.trim();

  const phone =
    document.getElementById("shopPhone").value.trim();

  const about =
    document.getElementById("shopAbout").value.trim();


  if (!name || !location || !phone) {

    alert(
      "Please enter the shop name, location and phone number."
    );

    return;
  }


  const shop = {

    name: name,

    location: location,

    phone: phone,

    about: about

  };


  localStorage.setItem(
    "nailUppShop",
    JSON.stringify(shop)
  );


  alert("Shop profile saved.");

}


/* LOAD SHOP */

function loadShop() {

  const saved =
    localStorage.getItem("nailUppShop");


  if (!saved) return;


  const shop =
    JSON.parse(saved);


  document.getElementById("shopName").value =
    shop.name || "";

  document.getElementById("shopLocation").value =
    shop.location || "";

  document.getElementById("shopPhone").value =
    shop.phone || "";

  document.getElementById("shopAbout").value =
    shop.about || "";

}


/* IMAGE PREVIEW */

function previewImage() {

  const file =
    document.getElementById("productImage").files[0];


  if (!file) return;


  const reader =
    new FileReader();


  reader.onload =
    function(event) {

      selectedImage =
        event.target.result;


      const preview =
        document.getElementById("preview");


      preview.src =
        selectedImage;


      preview.style.display =
        "block";

    };


  reader.readAsDataURL(file);

}


/* ADD PRODUCT */

function addProduct() {

  const name =
    document.getElementById("productName").value.trim();

  const category =
    document.getElementById("category").value;

  const price =
    document.getElementById("productPrice").value;

  const description =
    document.getElementById("productDescription").value.trim();


  if (!selectedImage) {

    alert("Please choose a product picture.");

    return;
  }


  if (!name || !category || !price) {

    alert(
      "Please enter the product name, category and price."
    );

    return;
  }


  const saved =
    localStorage.getItem("nailUppProducts");


  const products =
    saved ? JSON.parse(saved) : [];


  products.push({

    id: Date.now(),

    name: name,

    category: category,

    price: price,

    description: description,

    image: selectedImage

  });


  localStorage.setItem(
    "nailUppProducts",
    JSON.stringify(products)
  );


  document.getElementById("productImage").value = "";

  document.getElementById("productName").value = "";

  document.getElementById("category").value = "";

  document.getElementById("productPrice").value = "";

  document.getElementById("productDescription").value = "";

  document.getElementById("preview").style.display = "none";


  selectedImage = "";


  loadProducts();


  alert("Product added successfully.");

}


/* LOAD PRODUCTS */

function loadProducts() {

  const saved =
    localStorage.getItem("nailUppProducts");


  const container =
    document.getElementById("products");


  if (!saved) {

    container.innerHTML =
      '<p class="empty">No products added yet.</p>';

    return;
  }


  const products =
    JSON.parse(saved);


  if (products.length === 0) {

    container.innerHTML =
      '<p class="empty">No products added yet.</p>';

    return;
  }


  let html = "";


  products.forEach(function(product) {

    html +=

      '<div class="product">' +

      '<img class="product-image" src="' +
      product.image +
      '" alt="' +
      product.name +
      '">' +

      '<h3>' +
      product.name +
      '</h3>' +

      '<p><strong>Category:</strong> ' +
      product.category +
      '</p>' +

      '<p class="price">UGX ' +
      Number(product.price).toLocaleString() +
      '</p>' +

      '<p>' +
      (product.description || "No description") +
      '</p>' +

      '<button class="delete" onclick="deleteProduct(' +
      product.id +
      ')">' +
      '🗑️ Delete Product' +
      '</button>' +

      '</div>';

  });


  container.innerHTML =
    html;

}


/* DELETE PRODUCT */

function deleteProduct(id) {

  const saved =
    localStorage.getItem("nailUppProducts");


  if (!saved) return;


  let products =
    JSON.parse(saved);


  products =
    products.filter(function(product) {

      return product.id !== id;

    });


  localStorage.setItem(
    "nailUppProducts",
    JSON.stringify(products)
  );


  loadProducts();

}


/* LOAD CUSTOMER ORDER */

function loadOrders() {

  const saved =
    localStorage.getItem("nailUppProductOrder");


  const container =
    document.getElementById("orders");


  if (!saved) {

    container.innerHTML =
      '<p class="empty">No customer orders yet.</p>';

    return;
  }


  const order =
    JSON.parse(saved);


  let html =

    '<div class="order">' +

    '<h3>🛒 Order #' +
    order.id +
    '</h3>' +

    '<p><strong>Customer:</strong> ' +
    order.clientName +
    '</p>' +

    '<p><strong>Phone:</strong> ' +
    (order.clientPhone || "Not provided") +
    '</p>';


  order.items.forEach(function(item) {

    html +=

      '<div class="order-item">' +

      '<strong>' +
      item.name +
      '</strong>' +

      '<p>Quantity: ' +
      item.quantity +
      '</p>' +

      '<p>Price: UGX ' +
      Number(item.price).toLocaleString() +
      '</p>' +

      '<p>Subtotal: UGX ' +
      Number(
        item.price * item.quantity
      ).toLocaleString() +
      '</p>' +

      '</div>';

  });


  html +=

    '<p class="price" style="margin-top:15px;">' +

    'TOTAL: UGX ' +

    Number(order.total).toLocaleString() +

    '</p>';


  if (order.status === "Waiting for shop") {

    html +=

      '<button class="accept" onclick="updateOrderStatus(\'Accepted by shop\')">' +

      '✅ Accept Order' +

      '</button>' +

      '<button class="decline" onclick="updateOrderStatus(\'Declined by shop\')">' +

      '❌ Decline' +

      '</button>';

  }


  let statusClass =
    "order-status";


  if (order.status === "Accepted by shop") {

    statusClass =
      "order-status accepted";

  }


  if (order.status === "Declined by shop") {

    statusClass =
      "order-status declined";

  }


  html +=

    '<div class="' +
    statusClass +
    '">' +

    'STATUS: ' +
    order.status +

    '</div>' +

    '</div>';


  container.innerHTML =
    html;

}


/* ACCEPT OR DECLINE ORDER */

function updateOrderStatus(status) {

  const saved =
    localStorage.getItem("nailUppProductOrder");


  if (!saved) return;


  const order =
    JSON.parse(saved);


  order.status =
    status;


  localStorage.setItem(
    "nailUppProductOrder",
    JSON.stringify(order)
  );


  loadOrders();


  alert(
    "Order status updated to: " +
    status
  );

}


/* LOGOUT */

function logout() {

  localStorage.removeItem("nailUppShop");

  window.location.href =
    "index.html";

}


/* START */

loadShop();

loadProducts();

loadOrders();

</script>

</body>
</html>
