<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nail Upp - Nail Shop</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #fff7fb;
      color: #333;
    }

    header {
      background: #d81b60;
      color: white;
      text-align: center;
      padding: 25px 15px;
      border-radius: 0 0 25px 25px;
    }

    header h1 {
      font-size: 28px;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 20px 15px 40px;
    }

    .card {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h2 {
      color: #d81b60;
      margin-bottom: 15px;
    }

    .shop-info p {
      margin: 8px 0;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 12px;
      margin-bottom: 6px;
    }

    input,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
    }

    input[type="file"] {
      padding: 10px;
    }

    textarea {
      min-height: 70px;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 25px;
      padding: 13px;
      margin-top: 15px;
      background: #d81b60;
      color: white;
      font-size: 15px;
      font-weight: bold;
    }

    .product {
      border: 1px solid #eee;
      padding: 15px;
      border-radius: 15px;
      margin-bottom: 15px;
    }

    .product img {
      width: 100%;
      max-height: 220px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 12px;
    }

    .product h3 {
      color: #d81b60;
      margin-bottom: 8px;
    }

    .product p {
      margin: 7px 0;
    }

    .delete {
      background: #c62828;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 15px;
    }

    .logout {
      background: #555;
    }
  </style>
</head>

<body>

<header>
  <h1>💅 Nail Upp</h1>
  <p>Nail Shop Dashboard</p>
</header>

<div class="container">

  <!-- SHOP INFORMATION -->

  <div class="card shop-info">

    <h2>🏪 My Shop</h2>

    <p>
      <strong>Name:</strong>
      <span id="shopName">Nail Shop</span>
    </p>

    <p>
      <strong>Phone:</strong>
      <span id="shopPhone">Not provided</span>
    </p>

    <p>
      <strong>Location:</strong>
      <span id="shopLocation">Not provided</span>
    </p>

    <p>
      <strong>About:</strong>
      <span id="shopAbout">Not provided</span>
    </p>

  </div>


  <!-- ADD PRODUCT -->

  <div class="card">

    <h2>➕ Add Product</h2>

    <label>Product Name</label>

    <input
      id="productName"
      type="text"
      placeholder="Example: Gel Polish"
    >


    <label>Price (UGX)</label>

    <input
      id="productPrice"
      type="number"
      placeholder="Example: 15000"
    >


    <label>Product Description</label>

    <textarea
      id="productDescription"
      placeholder="Describe your product"
    ></textarea>


    <label>Product Picture</label>

    <input
      id="productImage"
      type="file"
      accept="image/*"
    >


    <button onclick="addProduct()">
      ➕ Add Product
    </button>

  </div>


  <!-- MY PRODUCTS -->

  <div class="card">

    <h2>📦 My Products</h2>

    <div id="products">

      <p class="empty">
        No products added yet.
      </p>

    </div>

  </div>


  <button class="logout" onclick="logout()">
    Log Out
  </button>

</div>


<script>

let shop = null;

let products = [];


/* LOAD SHOP */

function loadShop() {

  const savedShop =
    localStorage.getItem("nailUppShop");


  if (!savedShop) {

    alert(
      "No Nail Shop is registered yet."
    );

    window.location.href =
      "index.html";

    return;
  }


  shop =
    JSON.parse(savedShop);


  document.getElementById(
    "shopName"
  ).textContent =
    shop.name || "Nail Shop";


  document.getElementById(
    "shopPhone"
  ).textContent =
    shop.phone || "Not provided";


  document.getElementById(
    "shopLocation"
  ).textContent =
    shop.location || "Not provided";


  document.getElementById(
    "shopAbout"
  ).textContent =
    shop.about || "Not provided";


  loadProducts();

}


/* LOAD PRODUCTS */

function loadProducts() {

  const saved =
    localStorage.getItem(
      "nailUppProducts_" + shop.id
    );


  products =
    saved ? JSON.parse(saved) : [];


  displayProducts();

}


/* ADD PRODUCT */

function addProduct() {

  const name =
    document.getElementById(
      "productName"
    ).value.trim();


  const price =
    document.getElementById(
      "productPrice"
    ).value;


  const description =
    document.getElementById(
      "productDescription"
    ).value.trim();


  const imageInput =
    document.getElementById(
      "productImage"
    );


  if (!name || !price) {

    alert(
      "Please enter the product name and price."
    );

    return;
  }


  if (imageInput.files.length === 0) {

    alert(
      "Please choose a product picture."
    );

    return;
  }


  const file =
    imageInput.files[0];


  const reader =
    new FileReader();


  reader.onload = function(event) {

    const product = {

      id: Date.now(),

      name: name,

      price: Number(price),

      description: description,

      image: event.target.result,

      shopId: shop.id,

      shopName: shop.name

    };


    products.push(product);


    localStorage.setItem(
      "nailUppProducts_" + shop.id,
      JSON.stringify(products)
    );


    /* Clear form */

    document.getElementById(
      "productName"
    ).value = "";


    document.getElementById(
      "productPrice"
    ).value = "";


    document.getElementById(
      "productDescription"
    ).value = "";


    document.getElementById(
      "productImage"
    ).value = "";


    displayProducts();


    alert(
      "Product added successfully!"
    );

  };


  reader.readAsDataURL(file);

}


/* DISPLAY PRODUCTS */

function displayProducts() {

  const container =
    document.getElementById(
      "products"
    );


  if (products.length === 0) {

    container.innerHTML =
      '<p class="empty">' +
      'No products added yet.' +
      '</p>';

    return;
  }


  let html = "";


  products.forEach(function(product) {

    html +=

      '<div class="product">' +

      '<img src="' +
      product.image +
      '" alt="' +
      product.name +
      '">' +

      '<h3>' +
      product.name +
      '</h3>' +

      '<p><strong>Price:</strong> UGX ' +
      Number(
        product.price
      ).toLocaleString() +
      '</p>' +

      '<p>' +
      (product.description ||
      "No description") +
      '</p>' +

      '<button class="delete" ' +
      'onclick="deleteProduct(' +
      product.id +
      ')">' +

      '🗑️ Delete Product' +

      '</button>' +

      '</div>';

  });


  container.innerHTML =
    html;

}


/* DELETE PRODUCT */

function deleteProduct(id) {

  const confirmDelete =
    confirm(
      "Delete this product?"
    );


  if (!confirmDelete) return;


  products =
    products.filter(
      function(product) {

        return product.id !== id;

      }
    );


  localStorage.setItem(
    "nailUppProducts_" + shop.id,
    JSON.stringify(products)
  );


  displayProducts();

}


/* LOGOUT */

function logout() {

  localStorage.removeItem(
    "nailUppShop"
  );

  window.location.href =
    "index.html";

}


/* START */

loadShop();

</script>

</body>
</html>
