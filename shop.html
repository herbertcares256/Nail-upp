```html id="h3m7qp"
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nail Shop Dashboard</title>

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #fff7fb;
  color: #333;
}

header {
  background: #d9165b;
  color: white;
  padding: 28px 18px;
  border-radius: 0 0 30px 30px;
  text-align: center;
}

header h1 {
  font-size: 28px;
}

header p {
  margin-top: 8px;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 20px 15px 50px;
}

.card {
  background: white;
  padding: 22px;
  border-radius: 22px;
  margin-bottom: 20px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

.shop-info {
  text-align: center;
}

.shop-icon {
  font-size: 55px;
}

h2 {
  color: #c91b5b;
  margin-bottom: 12px;
}

button {
  width: 100%;
  border: none;
  border-radius: 25px;
  padding: 15px;
  margin-top: 12px;
  background: #d9165b;
  color: white;
  font-size: 16px;
  font-weight: bold;
}

.secondary {
  background: #555;
}

.logout {
  background: #777;
}

.message {
  text-align: center;
  color: #c91b5b;
  margin-top: 10px;
}

</style>
</head>

<body>

<header>

  <h1>
    🛍️ Nail Shop Dashboard
  </h1>

  <p id="shopNameHeader">
    Loading shop...
  </p>

</header>


<div class="container">


  <!-- SHOP INFORMATION -->

  <div class="card shop-info">

    <div class="shop-icon">
      🏪
    </div>

    <h2 id="shopName">
      Nail Shop
    </h2>

    <p id="shopLocation">
      📍 Location
    </p>

    <p
      id="shopPhone"
      style="margin-top:7px;">
      📞 Phone
    </p>

  </div>


  <!-- ORDERS -->

  <div class="card">

    <h2>
      📦 Customer Orders
    </h2>

    <p>
      View and manage orders from customers.
    </p>

    <button
      onclick="openOrders()">

      📦 View Orders

    </button>

  </div>


  <!-- PRODUCTS -->

  <div class="card">

    <h2>
      🛍️ Shop Products
    </h2>

    <p>
      Add and manage your nail products.
    </p>

    <button
      onclick="openProducts()">

      ➕ Manage Products

    </button>

  </div>


  <!-- CLIENT VIEW -->

  <div class="card">

    <h2>
      👀 Customer View
    </h2>

    <p>
      See how customers view your shop.
    </p>

    <button
      onclick="openCustomerView()">

      👀 View My Shop

    </button>

  </div>


  <button
    class="secondary"
    onclick="goHome()">

    ← Back to Nail Upp

  </button>


  <button
    class="logout"
    onclick="logout()">

    🔐 Logout

  </button>


</div>


<script>

/* CURRENT SHOP */

const savedShop =
  localStorage.getItem(
    "nailUppShop"
  );


if (!savedShop) {

  alert(
    "Please register as a Nail Shop first."
  );

  window.location.href =
    "index.html";

}


const currentShop =
  JSON.parse(savedShop);


/* SHOP INFORMATION */

document.getElementById(
  "shopNameHeader"
).textContent =
  currentShop.name ||
  "Nail Shop";


document.getElementById(
  "shopName"
).textContent =
  currentShop.name ||
  "Nail Shop";


document.getElementById(
  "shopLocation"
).textContent =
  "📍 " +
  (
    currentShop.location ||
    "Location not provided"
  );


document.getElementById(
  "shopPhone"
).textContent =
  "📞 " +
  (
    currentShop.phone ||
    "Phone not provided"
  );


/* ORDERS */

function openOrders() {

  window.location.href =
    "shop-orders.html";

}


/* PRODUCTS */

function openProducts() {

  window.location.href =
    "shop.html";

}


/* CUSTOMER VIEW */

function openCustomerView() {

  localStorage.setItem(
    "selectedNailUppShop",
    JSON.stringify(
      currentShop
    )
  );


  window.location.href =
    "shop-products.html";

}


/* HOME */

function goHome() {

  window.location.href =
    "index.html";

}


/* LOGOUT */

function logout() {

  localStorage.removeItem(
    "nailUppShop"
  );


  window.location.href =
    "index.html";

}

</script>

</body>
</html>
