<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nail Upp - Nail Shops</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #fff7fb;
  color: #333;
}

header {
  background: #d81b60;
  color: white;
  text-align: center;
  padding: 25px 15px;
  border-radius: 0 0 25px 25px;
}

header h1 {
  font-size: 28px;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 20px 15px 40px;
}

.back {
  display: inline-block;
  margin-bottom: 18px;
  color: #d81b60;
  font-weight: bold;
  text-decoration: none;
}

h2 {
  color: #d81b60;
  margin-bottom: 15px;
}

.shop {
  background: white;
  padding: 20px;
  border-radius: 18px;
  margin-bottom: 18px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

.shop h3 {
  color: #d81b60;
  font-size: 20px;
  margin-bottom: 10px;
}

.shop p {
  margin: 8px 0;
}

.shop button {
  width: 100%;
  border: none;
  border-radius: 25px;
  padding: 13px;
  margin-top: 12px;
  background: #d81b60;
  color: white;
  font-size: 15px;
  font-weight: bold;
}

.empty {
  background: white;
  padding: 25px;
  border-radius: 18px;
  text-align: center;
  color: #777;
  box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

.refresh {
  background: #555 !important;
}
</style>
</head>

<body>

<header>
  <h1>💅 Nail Upp</h1>
  <p>Find Nail Shops</p>
</header>

<div class="container">

<a href="client.html" class="back">
← Back to Client Dashboard
</a>

<h2>🏪 Nail Shops</h2>

<div id="shops">
  <div class="empty">
    Loading shops...
  </div>
</div>

<button
  class="shop refresh"
  onclick="loadShops()">
  🔄 Refresh Shops
</button>

</div>


<script>

function loadShops() {

  const container =
    document.getElementById("shops");


  const saved =
    localStorage.getItem(
      "nailUppRegisteredShops"
    );


  const shops =
    saved
      ? JSON.parse(saved)
      : [];


  if (shops.length === 0) {

    container.innerHTML =
      '<div class="empty">' +

      '<h3>No Nail Shops Yet</h3>' +

      '<p>' +
      'Nail shops will appear here ' +
      'when they register.' +
      '</p>' +

      '</div>';

    return;
  }


  let html = "";


  shops.forEach(function(shop) {

    html +=

      '<div class="shop">' +

      '<h3>🏪 ' +
      (shop.name ||
      "Nail Shop") +
      '</h3>' +

      '<p>📍 <strong>Location:</strong> ' +
      (shop.location ||
      "Not provided") +
      '</p>' +

      '<p>📞 <strong>Phone:</strong> ' +
      (shop.phone ||
      "Not provided") +
      '</p>' +

      '<p>ℹ️ ' +
      (shop.about ||
      "Nail services and products") +
      '</p>' +

      '<button onclick="viewShop(\'' +
      shop.id +
      '\')">' +

      '🛍️ View Products' +

      '</button>' +

      '</div>';

  });


  container.innerHTML =
    html;

}


/* OPEN SHOP */

function viewShop(shopId) {

  const saved =
    localStorage.getItem(
      "nailUppRegisteredShops"
    );


  const shops =
    saved
      ? JSON.parse(saved)
      : [];


  const shop =
    shops.find(
      function(item) {

        return item.id === shopId;

      }
    );


  if (!shop) {

    alert(
      "Shop could not be found."
    );

    return;
  }


  /*
    Save the selected shop so
    shop-products.html knows
    which shop the client chose.
  */

  localStorage.setItem(
    "selectedNailUppShop",
    JSON.stringify(shop)
  );


  window.location.href =
    "shop-products.html";

}


/* LOAD SHOPS */

loadShops();

</script>

</body>
</html>
