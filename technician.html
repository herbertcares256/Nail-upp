<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nail Upp - Technician</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #fff7fb;
      color: #333;
    }

    header {
      background: #d81b60;
      color: white;
      text-align: center;
      padding: 25px 15px;
      border-radius: 0 0 25px 25px;
    }

    header h1 {
      font-size: 28px;
    }

    header p {
      margin-top: 6px;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 20px 15px 40px;
    }

    .welcome {
      text-align: center;
      margin-bottom: 20px;
    }

    .welcome h2 {
      color: #d81b60;
      margin-bottom: 8px;
    }

    .card {
      background: white;
      padding: 20px;
      margin-bottom: 18px;
      border-radius: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .card h2 {
      color: #d81b60;
      margin-bottom: 15px;
    }

    .request {
      border: 1px solid #eee;
      border-radius: 14px;
      padding: 15px;
      margin-bottom: 12px;
    }

    .request h3 {
      margin-bottom: 8px;
    }

    .request p {
      margin: 6px 0;
      font-size: 14px;
    }

    .status {
      color: #d81b60;
      font-weight: bold;
      margin-top: 10px;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .accept,
    .decline {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 22px;
      color: white;
      font-size: 14px;
      font-weight: bold;
    }

    .accept {
      background: #2e7d32;
    }

    .decline {
      background: #c62828;
    }

    .empty {
      color: #777;
      text-align: center;
      padding: 15px;
    }

    .logout {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 25px;
      background: #d81b60;
      color: white;
      font-size: 15px;
    }

    .profile p {
      margin: 8px 0;
    }
  </style>
</head>

<body>

<header>
  <h1>💅 Nail Upp</h1>
  <p>Technician Dashboard</p>
</header>

<div class="container">

  <div class="welcome">
    <h2>Welcome, Technician!</h2>
    <p>Manage your Nail Upp service requests.</p>
  </div>

  <div class="card">
    <h2>📋 New Service Requests</h2>

    <div id="requests">
      <p class="empty">No service requests yet.</p>
    </div>

  </div>

  <div class="card profile">

    <h2>👤 My Profile</h2>

    <p>
      <strong>Name:</strong>
      <span id="technicianName">Technician</span>
    </p>

    <p>
      <strong>Phone:</strong>
      <span id="technicianPhone">Not added</span>
    </p>

  </div>

  <button class="logout" onclick="logout()">
    Log Out
  </button>

</div>

<script>

  // Show technician information
  document.getElementById("technicianName").textContent =
    localStorage.getItem("nailUppName") || "Technician";

  document.getElementById("technicianPhone").textContent =
    localStorage.getItem("nailUppPhone") || "Not added";


  // Load client service request
  function loadRequest() {

    const savedRequest =
      localStorage.getItem("nailUppServiceRequest");

    const requests =
      document.getElementById("requests");

    if (!savedRequest) {
      requests.innerHTML =
        '<p class="empty">No service requests yet.</p>';
      return;
    }

    const request = JSON.parse(savedRequest);

    if (request.status === "Declined") {
      requests.innerHTML =
        '<p class="empty">No active service requests.</p>';
      return;
    }

    requests.innerHTML =

      '<div class="request">' +

      '<h3>💅 ' + request.service + '</h3>' +

      '<p><strong>Client:</strong> ' +
      request.clientName + '</p>' +

      '<p><strong>Phone:</strong> ' +
      request.phone + '</p>' +

      '<p><strong>Date:</strong> ' +
      request.date + '</p>' +

      '<p><strong>Time:</strong> ' +
      request.time + '</p>' +

      '<p><strong>Location:</strong> ' +
      request.location + '</p>' +

      '<p><strong>Instructions:</strong> ' +
      (request.instructions || "None") + '</p>' +

      '<p class="status">Status: ' +
      request.status + '</p>' +

      '<div class="buttons">' +

      '<button class="accept" onclick="acceptRequest()">' +
      'Accept' +
      '</button>' +

      '<button class="decline" onclick="declineRequest()">' +
      'Decline' +
      '</button>' +

      '</div>' +

      '</div>';
  }


  // Accept request
  function acceptRequest() {

    const savedRequest =
      localStorage.getItem("nailUppServiceRequest");

    if (!savedRequest) return;

    const request = JSON.parse(savedRequest);

    request.status = "Accepted by technician";

    localStorage.setItem(
      "nailUppServiceRequest",
      JSON.stringify(request)
    );

    alert("Service request accepted!");

    loadRequest();
  }


  // Decline request
  function declineRequest() {

    const savedRequest =
      localStorage.getItem("nailUppServiceRequest");

    if (!savedRequest) return;

    const request = JSON.parse(savedRequest);

    request.status = "Declined";

    localStorage.setItem(
      "nailUppServiceRequest",
      JSON.stringify(request)
    );

    alert("Service request declined.");

    loadRequest();
  }


  // Logout
  function logout() {

    localStorage.removeItem("nailUppName");
    localStorage.removeItem("nailUppPhone");
    localStorage.removeItem("nailUppEmail");
    localStorage.removeItem("nailUppRole");

    window.location.href = "index.html";
  }


  // Load requests when page opens
  loadRequest();

</script>

</body>
</html>
