<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nail Upp - Technician</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #fff7fb;
      color: #333;
    }

    header {
      background: #d81b60;
      color: white;
      text-align: center;
      padding: 25px 15px;
      border-radius: 0 0 25px 25px;
    }

    header h1 {
      font-size: 28px;
    }

    header p {
      margin-top: 6px;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 20px 15px 40px;
    }

    .welcome {
      text-align: center;
      margin-bottom: 20px;
    }

    .welcome h2 {
      color: #d81b60;
      margin-bottom: 8px;
    }

    .card {
      background: white;
      padding: 20px;
      margin-bottom: 18px;
      border-radius: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .card h2 {
      color: #d81b60;
      margin-bottom: 15px;
    }

    .request {
      border: 1px solid #eee;
      border-radius: 14px;
      padding: 15px;
    }

    .request h3 {
      margin-bottom: 10px;
    }

    .request p {
      margin: 7px 0;
      font-size: 14px;
    }

    .status {
      color: #d81b60;
      font-weight: bold;
      margin-top: 12px;
      font-size: 16px;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    button {
      border: none;
      border-radius: 22px;
      padding: 12px;
      font-size: 14px;
      font-weight: bold;
    }

    .accept {
      flex: 1;
      background: #2e7d32;
      color: white;
    }

    .decline {
      flex: 1;
      background: #c62828;
      color: white;
    }

    .statusButton {
      width: 100%;
      margin-top: 10px;
      background: #d81b60;
      color: white;
    }

    .empty {
      color: #777;
      text-align: center;
      padding: 15px;
    }

    .profile p {
      margin: 8px 0;
    }

    .logout {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 25px;
      background: #d81b60;
      color: white;
      font-size: 15px;
    }
  </style>
</head>

<body>

<header>
  <h1>💅 Nail Upp</h1>
  <p>Technician Dashboard</p>
</header>

<div class="container">

  <div class="welcome">
    <h2>Welcome, <span id="technicianName">Technician</span>!</h2>
    <p>Manage your service requests.</p>
  </div>

  <div class="card">

    <h2>📋 Current Job</h2>

    <div id="job">
      <p class="empty">No active job.</p>
    </div>

  </div>

  <div class="card profile">

    <h2>👤 My Profile</h2>

    <p>
      <strong>Name:</strong>
      <span id="profileName">Technician</span>
    </p>

    <p>
      <strong>Phone:</strong>
      <span id="profilePhone">Not added</span>
    </p>

  </div>

  <button class="logout" onclick="logout()">
    Log Out
  </button>

</div>

<script>

document.getElementById("technicianName").textContent =
  localStorage.getItem("nailUppName") || "Technician";

document.getElementById("profileName").textContent =
  localStorage.getItem("nailUppName") || "Technician";

document.getElementById("profilePhone").textContent =
  localStorage.getItem("nailUppPhone") || "Not added";


function loadJob() {

  const saved =
    localStorage.getItem("nailUppServiceRequest");

  const job = document.getElementById("job");

  if (!saved) {
    job.innerHTML =
      '<p class="empty">No active job.</p>';
    return;
  }

  const request = JSON.parse(saved);

  if (request.status === "Declined" ||
      request.status === "Completed") {

    job.innerHTML =
      '<p class="empty">No active job.</p>';

    return;
  }

  let buttons = "";

  if (request.status === "Waiting for technician") {

    buttons =
      '<div class="buttons">' +
      '<button class="accept" onclick="acceptJob()">Accept</button>' +
      '<button class="decline" onclick="declineJob()">Decline</button>' +
      '</div>';

  } else if (request.status === "Accepted by technician") {

    buttons =
      '<button class="statusButton" onclick="updateStatus(\'On the Way\')">' +
      '🚗 I\'m On the Way' +
      '</button>';

  } else if (request.status === "On the Way") {

    buttons =
      '<button class="statusButton" onclick="updateStatus(\'Arrived\')">' +
      '📍 I Have Arrived' +
      '</button>';

  } else if (request.status === "Arrived") {

    buttons =
      '<button class="statusButton" onclick="updateStatus(\'Service Started\')">' +
      '💅 Start Service' +
      '</button>';

  } else if (request.status === "Service Started") {

    buttons =
      '<button class="statusButton" onclick="updateStatus(\'Completed\')">' +
      '✅ Complete Service' +
      '</button>';
  }

  job.innerHTML =

    '<div class="request">' +

    '<h3>💅 ' + request.service + '</h3>' +

    '<p><strong>Client:</strong> ' +
    request.clientName + '</p>' +

    '<p><strong>Phone:</strong> ' +
    request.phone + '</p>' +

    '<p><strong>Date:</strong> ' +
    request.date + '</p>' +

    '<p><strong>Time:</strong> ' +
    request.time + '</p>' +

    '<p><strong>Location:</strong> ' +
    request.location + '</p>' +

    '<p><strong>Instructions:</strong> ' +
    (request.instructions || "None") + '</p>' +

    '<p class="status">Status: ' +
    request.status + '</p>' +

    buttons +

    '</div>';
}


function acceptJob() {

  const saved =
    localStorage.getItem("nailUppServiceRequest");

  if (!saved) return;

  const request = JSON.parse(saved);

  request.status = "Accepted by technician";

  localStorage.setItem(
    "nailUppServiceRequest",
    JSON.stringify(request)
  );

  loadJob();
}


function declineJob() {

  const saved =
    localStorage.getItem("nailUppServiceRequest");

  if (!saved) return;

  const request = JSON.parse(saved);

  request.status = "Declined";

  localStorage.setItem(
    "nailUppServiceRequest",
    JSON.stringify(request)
  );

  loadJob();
}


function updateStatus(newStatus) {

  const saved =
    localStorage.getItem("nailUppServiceRequest");

  if (!saved) return;

  const request = JSON.parse(saved);

  request.status = newStatus;

  localStorage.setItem(
    "nailUppServiceRequest",
    JSON.stringify(request)
  );

  loadJob();
}


function logout() {

  localStorage.clear();

  window.location.href = "index.html";
}


loadJob();

</script>

</body>
</html>
