```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nail Shop Products</title>

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #fff7fb;
  color: #333;
}

header {
  background: #d9165b;
  color: white;
  text-align: center;
  padding: 30px 18px;
  border-radius: 0 0 30px 30px;
}

header h1 {
  font-size: 28px;
}

header p {
  margin-top: 8px;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 20px 15px 50px;
}

.back {
  display: inline-block;
  color: #d9165b;
  font-weight: bold;
  text-decoration: none;
  margin-bottom: 18px;
}

.shop-card {
  background: white;
  padding: 22px;
  border-radius: 22px;
  margin-bottom: 20px;
  text-align: center;
  box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

}

}

.product {

  margin-bottom: 18px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

.product-image {
  width: 100%;
  height: 210px;
  object-fit: cover;
  border-radius: 15px;
  background: #fff0f5;
}

.product h3 {
  color: #c91b5b;
  margin-top: 13px;
  font-size: 21px;
}

.description {
  color: #666;

}

.price {

}

.stock {
  margin-top: 7px;

}

button {
  width: 100%;
  border: none;
  border-radius: 25px;

  font-weight: bold;
}

  padding: 20px;

.cart h2 {
  color: #c91b5b;

.cart-item {
  padding: 12px 0;

</style>
</head>

<body>

<header>

  <h1>
    🛍️ Nail Shop
  </h1>

  <p id="shopHeader">
    Products
  </p>

</header>


<div class="container">

  <a
    href="shops.html"
    class="back">

    ← Back to Nail Shops

  </a>


  <!-- SHOP INFORMATION -->

  <div
    class="shop-card"
    id="shopInfo">

    Loading shop...

  </div>


  <!-- PRODUCTS -->

  <div id="productList">

    <div class="empty">
      Loading products...
    </div>

  </div>


  <!-- CART -->

  <div
    class="cart"
    id="cart">

    <h2>
      🛒 My Cart
    </h2>

    <div id="cartItems">
      <p class="empty">
        Your cart is empty.
      </p>
    </div>

    <div
      class="total"
      id="cartTotal">

      Total: UGX 0

    </div>

    <button
      onclick="checkout()">

      🛒 Order Products

    </button>

  </div>


  <button
    class="secondary"
    onclick="goBack()">

    ← Back to Shops

  </button>

</div>


<script>

/* GET SELECTED SHOP */

const savedShop =
  localStorage.getItem(
    "selectedNailUppShop"
  );


if (!savedShop) {

  alert(
    "Please select a nail shop first."
  );

  window.location.href =
    "shops.html";

}


const selectedShop =
  JSON.parse(savedShop);


/* SHOW SHOP */

document.getElementById(
  "shopHeader"
).textContent =
  selectedShop.name ||
  "Nail Shop";


document.getElementById(
  "shopInfo"
).innerHTML =

  "<h2>🏪 " +
  escapeHTML(
    selectedShop.name ||
    "Nail Shop"
  ) +
  "</h2>" +

  "<p>📍 " +
  escapeHTML(
    selectedShop.location ||
    "Location not provided"
  ) +
  "</p>" +

  "<p>📞 " +
  escapeHTML(
    selectedShop.phone ||
    "Phone not provided"
  ) +
  "</p>" +

  "<p>" +
  escapeHTML(
    selectedShop.about ||
    "Nail products available here."
  ) +
  "</p>";


/* LOAD PRODUCTS */

function loadProducts() {

  const saved =
    localStorage.getItem(
      "nailUppProducts"
    );


  const products =
    saved
      ? JSON.parse(saved)
      : [];


  const shopProducts =
    products.filter(
      function(product) {

        return (
          product.shopId ===
          selectedShop.id
        );

      }
    );


  const list =
    document.getElementById(
      "productList"
    );


  if (
    shopProducts.length === 0
  ) {

    list.innerHTML =

      '<div class="empty">' +

      '<h3>No Products Yet</h3>' +

      '<p>' +
      'This nail shop has not added products yet.' +
      '</p>' +

      '</div>';

    return;

  }


  let html = "";


  shopProducts.forEach(
    function(product) {

      const stock =
        Number(product.stock);


      html +=

        '<div class="product">' +

        '<img ' +
        'class="product-image" ' +
        'src="' +
        product.image +
        '" ' +
        'alt="Product">' +

        '<h3>' +
        escapeHTML(
          product.name
        ) +
        '</h3>' +

        '<p class="description">' +
        escapeHTML(
          product.description ||
          "No description available."
        ) +
        '</p>' +

        '<p class="price">' +
        'UGX ' +
        Number(
          product.price
        ).toLocaleString() +
        '</p>' +

        '<p class="stock">' +
        '📦 Stock: ' +
        stock +
        '</p>' +

        (
          stock > 0

          ?

          '<button onclick="addToCart(\'' +
          product.id +
          '\')">' +
          '🛒 Add to Cart' +
          '</button>'

          :

          '<button disabled ' +
          'style="background:#999">' +
          'Out of Stock' +
          '</button>'
        ) +

        '</div>';

    }
  );


  list.innerHTML =
    html;

}


/* CART */

let cartItems = [];


function addToCart(productId) {

  const saved =
    localStorage.getItem(
      "nailUppProducts"
    );


  const products =
    saved
      ? JSON.parse(saved)
      : [];


  const product =
    products.find(
      function(item) {

        return (
          item.id ===
          productId
        );

      }
    );


  if (!product) {

    alert(
      "Product not found."
    );

    return;

  }


  const existing =
    cartItems.find(
      function(item) {

        return (
          item.id ===
          productId
        );

      }
    );


  if (existing) {

    if (
      existing.quantity <
      Number(product.stock)
    ) {

      existing.quantity++;

    } else {

      alert(
        "You cannot order more than the available stock."
      );

    }

  } else {

    cartItems.push({

      id:
        product.id,

      name:
        product.name,

      price:
        Number(product.price),

      quantity:
        1

    });

  }


  updateCart();

}


/* UPDATE CART */

function updateCart() {

  const container =
    document.getElementById(
      "cartItems"
    );


  if (
    cartItems.length === 0
  ) {

    container.innerHTML =
      '<p class="empty">' +
      'Your cart is empty.' +
      '</p>';

    document.getElementById(
      "cartTotal"
    ).textContent =
      "Total: UGX 0";

    return;

  }


  let html = "";
  let total = 0;


  cartItems.forEach(
    function(item) {

      const itemTotal =
        item.price *
        item.quantity;


      total +=
        itemTotal;


      html +=

        '<div class="cart-item">' +

        '<strong>' +
        escapeHTML(
          item.name
        ) +
        '</strong>' +

        '<br>' +

        'Quantity: ' +
        item.quantity +

        '<br>' +

        'UGX ' +
        itemTotal.toLocaleString() +

        '<button ' +
        'onclick="removeFromCart(\'' +
        item.id +
        '\')" ' +
        'style="background:#777">' +

        'Remove' +

        '</button>' +

        '</div>';

    }
  );


  container.innerHTML =
    html;


  document.getElementById(
    "cartTotal"
  ).textContent =

    "Total: UGX " +
    total.toLocaleString();

}


/* REMOVE FROM CART */

function removeFromCart(productId) {

  cartItems =
    cartItems.filter(
      function(item) {

        return (
          item.id !==
          productId
        );

      }
    );


  updateCart();

}


/* CHECKOUT */

function checkout() {

  if (
    cartItems.length === 0
  ) {

    alert(
      "Please add a product to your cart first."
    );

    return;

  }


  localStorage.setItem(
    "nailUppCart",
    JSON.stringify(
      cartItems
    )
  );


  localStorage.setItem(
    "nailUppOrderShop",
    JSON.stringify(
      selectedShop
    )
  );


  alert(
    "Your products are ready to order!"
  );

}


/* ESCAPE TEXT */

function escapeHTML(text) {

  return String(text)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* BACK */

function goBack() {

  window.location.href =
    "shops.html";

}


/* START */

loadProducts();
updateCart();

</script>

</body>
</html>
