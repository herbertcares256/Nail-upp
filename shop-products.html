<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nail Upp - Shop Products</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #fff7fb;
      color: #333;
    }

    header {
      background: #d81b60;
      color: white;
      text-align: center;
      padding: 25px 15px;
      border-radius: 0 0 25px 25px;
    }

    header h1 {
      font-size: 28px;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 20px 15px 40px;
    }

    .back {
      display: inline-block;
      margin-bottom: 18px;
      color: #d81b60;
      font-weight: bold;
      text-decoration: none;
    }

    .shop-info,
    .cart,
    .product {
      background: white;
      padding: 18px;
      border-radius: 18px;
      margin-bottom: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .shop-info h2,
    .cart h2 {
      color: #d81b60;
      margin-bottom: 10px;
    }

    .shop-info p {
      margin: 7px 0;
    }

    .products {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .product {
      margin-bottom: 0;
      padding: 12px;
    }

    .product img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 10px;
    }

    .product h3 {
      color: #d81b60;
      font-size: 17px;
      margin-bottom: 7px;
    }

    .product p {
      margin: 6px 0;
      font-size: 14px;
    }

    .price {
      font-weight: bold;
      font-size: 16px !important;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 25px;
      padding: 12px;
      margin-top: 10px;
      background: #d81b60;
      color: white;
      font-weight: bold;
      font-size: 14px;
    }

    .quantity {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
    }

    .quantity button {
      width: 40px;
      margin: 0;
      padding: 8px;
    }

    .quantity span {
      min-width: 25px;
      text-align: center;
      font-weight: bold;
    }

    .cart-item {
      border-bottom: 1px solid #eee;
      padding: 10px 0;
    }

    .cart-item:last-child {
      border-bottom: none;
    }

    .cart-item p {
      margin: 5px 0;
    }

    .total {
      font-size: 18px;
      font-weight: bold;
      margin-top: 15px;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 20px;
    }

    .order-button {
      margin-top: 15px;
      font-size: 16px;
    }

    @media (max-width: 500px) {
      .products {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>💅 Nail Upp</h1>
  <p>Nail Shop Products</p>
</header>

<div class="container">

  <a href="shops.html" class="back">
    ← Choose Another Shop
  </a>

  <!-- SHOP INFORMATION -->

  <div class="shop-info">

    <h2>🏪 <span id="shopName">Nail Shop</span></h2>

    <p>
      📍 <strong>Location:</strong>
      <span id="shopLocation">Not provided</span>
    </p>

    <p>
      📞 <strong>Phone:</strong>
      <span id="shopPhone">Not provided</span>
    </p>

    <p id="shopAbout"></p>

  </div>


  <!-- PRODUCTS -->

  <h2 style="color:#d81b60; margin-bottom:15px;">
    🛍️ Products
  </h2>

  <div id="products" class="products">
    <p class="empty">Loading products...</p>
  </div>


  <!-- CART -->

  <div class="cart">

    <h2>🛒 My Cart</h2>

    <div id="cart">
      <p class="empty">Your cart is empty.</p>
    </div>

  </div>

</div>


<script>

let shop = null;

let products = [];

let cart = [];


/* LOAD SELECTED SHOP */

function loadShop() {

  const saved =
    localStorage.getItem(
      "selectedNailUppShop"
    );


  if (!saved) {

    alert(
      "Please choose a nail shop first."
    );

    window.location.href =
      "shops.html";

    return;
  }


  shop =
    JSON.parse(saved);


  document.getElementById(
    "shopName"
  ).textContent =
    shop.name || "Nail Shop";


  document.getElementById(
    "shopLocation"
  ).textContent =
    shop.location || "Not provided";


  document.getElementById(
    "shopPhone"
  ).textContent =
    shop.phone || "Not provided";


  document.getElementById(
    "shopAbout"
  ).textContent =
    shop.about || "";


  loadProducts();

}


/* LOAD PRODUCTS FROM SELECTED SHOP */

function loadProducts() {

  const saved =
    localStorage.getItem(
      "nailUppProducts_" + shop.id
    );


  products =
    saved ? JSON.parse(saved) : [];


  displayProducts();

}


/* DISPLAY PRODUCTS */

function displayProducts() {

  const container =
    document.getElementById(
      "products"
    );


  if (products.length === 0) {

    container.innerHTML =
      '<p class="empty">' +
      'This shop has no products yet.' +
      '</p>';

    return;
  }


  let html = "";


  products.forEach(function(product) {

    html +=

      '<div class="product">' +

      '<img src="' +
      product.image +
      '" alt="' +
      product.name +
      '">' +

      '<h3>' +
      product.name +
      '</h3>' +

      '<p class="price">' +
      'UGX ' +
      Number(
        product.price
      ).toLocaleString() +
      '</p>' +

      '<p>' +
      (product.description || "") +
      '</p>' +

      '<button onclick="addToCart(' +
      product.id +
      ')">' +

      '🛒 Add to Cart' +

      '</button>' +

      '</div>';

  });


  container.innerHTML =
    html;

}


/* ADD PRODUCT TO CART */

function addToCart(productId) {

  const product =
    products.find(function(item) {

      return item.id === productId;

    });


  if (!product) return;


  const existing =
    cart.find(function(item) {

      return item.id === productId;

    });


  if (existing) {

    existing.quantity++;

  } else {

    cart.push({

      id: product.id,

      name: product.name,

      price: product.price,

      quantity: 1,

      image: product.image

    });

  }


  displayCart();

}


/* CHANGE QUANTITY */

function changeQuantity(
  productId,
  amount
) {

  const item =
    cart.find(function(product) {

      return product.id === productId;

    });


  if (!item) return;


  item.quantity += amount;


  if (item.quantity <= 0) {

    cart =
      cart.filter(function(product) {

        return product.id !== productId;

      });

  }


  displayCart();

}


/* DISPLAY CART */

function displayCart() {

  const container =
    document.getElementById(
      "cart"
    );


  if (cart.length === 0) {

    container.innerHTML =
      '<p class="empty">' +
      'Your cart is empty.' +
      '</p>';

    return;
  }


  let total = 0;

  let html = "";


  cart.forEach(function(item) {

    const subtotal =
      item.price *
      item.quantity;


    total += subtotal;


    html +=

      '<div class="cart-item">' +

      '<strong>' +
      item.name +
      '</strong>' +

      '<p>UGX ' +
      Number(
        item.price
      ).toLocaleString() +
      ' each</p>' +

      '<div class="quantity">' +

      '<button onclick="changeQuantity(' +
      item.id +
      ',-1)">−</button>' +

      '<span>' +
      item.quantity +
      '</span>' +

      '<button onclick="changeQuantity(' +
      item.id +
      ',1)">+</button>' +

      '</div>' +

      '<p>' +
      '<strong>Subtotal:</strong> UGX ' +
      Number(
        subtotal
      ).toLocaleString() +
      '</p>' +

      '</div>';

  });


  html +=

    '<p class="total">' +

    'TOTAL: UGX ' +

    Number(
      total
    ).toLocaleString() +

    '</p>' +

    '<button class="order-button" ' +
    'onclick="placeOrder()">' +

    '✅ Place Order' +

    '</button>';


  container.innerHTML =
    html;

}


/* PLACE ORDER */

function placeOrder() {

  if (cart.length === 0) {

    alert(
      "Your cart is empty."
    );

    return;
  }


  let total = 0;


  cart.forEach(function(item) {

    total +=
      item.price *
      item.quantity;

  });


  const order = {

    id:
      "NU-" +
      Date.now(),

    shopId:
      shop.id,

    shopName:
      shop.name,

    items:
      cart,

    total:
      total,

    status:
      "Waiting for shop",

    date:
      new Date().toLocaleString()

  };


  /* Save order for client */

  localStorage.setItem(
    "nailUppProductOrder",
    JSON.stringify(order)
  );


  /*
    Also save the order for the shop.
    This will allow us to build the
    shop's order page next.
  */

  const shopOrdersKey =
    "nailUppOrders_" +
    shop.id;


  const savedOrders =
    localStorage.getItem(
      shopOrdersKey
    );


  const orders =
    savedOrders
      ? JSON.parse(savedOrders)
      : [];


  orders.push(order);


  localStorage.setItem(
    shopOrdersKey,
    JSON.stringify(orders)
  );


  alert(
    "Order placed successfully!"
  );


  cart = [];

  displayCart();

}


loadShop();

</script>

</body>
</html>
