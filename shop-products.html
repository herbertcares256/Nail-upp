<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nail Upp - Shop Products</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #fff7fb;
      color: #333;
    }

    header {
      background: #d81b60;
      color: white;
      text-align: center;
      padding: 25px 15px;
      border-radius: 0 0 25px 25px;
    }

    header h1 {
      font-size: 28px;
    }

    header p {
      margin-top: 6px;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 20px 15px 40px;
    }

    .back {
      display: inline-block;
      margin-bottom: 18px;
      color: #d81b60;
      font-weight: bold;
      text-decoration: none;
    }

    .shop-card {
      background: white;
      padding: 20px;
      border-radius: 18px;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .shop-card h2 {
      color: #d81b60;
      margin-bottom: 10px;
    }

    .shop-card p {
      margin: 7px 0;
      font-size: 14px;
    }

    .search {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 25px;
      font-size: 15px;
      margin-bottom: 20px;
    }

    .product {
      background: white;
      border-radius: 18px;
      padding: 15px;
      margin-bottom: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .product-image {
      width: 100%;
      height: 220px;
      object-fit: cover;
      border-radius: 14px;
      margin-bottom: 12px;
    }

    .product h3 {
      color: #d81b60;
      margin-bottom: 7px;
    }

    .product p {
      margin: 6px 0;
      font-size: 14px;
    }

    .price {
      font-size: 18px;
      font-weight: bold;
    }

    .quantity {
      width: 100%;
      padding: 11px;
      margin-top: 10px;
      border: 1px solid #ddd;
      border-radius: 10px;
    }

    .cart-button,
    .order-button {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border: none;
      border-radius: 25px;
      color: white;
      font-size: 15px;
      font-weight: bold;
    }

    .cart-button {
      background: #d81b60;
    }

    .order-button {
      background: #2e7d32;
    }

    .cart {
      background: white;
      padding: 20px;
      border-radius: 18px;
      margin-top: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .cart h2 {
      color: #d81b60;
      margin-bottom: 15px;
    }

    .cart-item {
      border-bottom: 1px solid #eee;
      padding: 10px 0;
    }

    .total {
      font-size: 19px;
      font-weight: bold;
      margin-top: 15px;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 20px;
    }
  </style>
</head>

<body>

<header>
  <h1>💅 Nail Upp</h1>
  <p>Shop Nail Products</p>
</header>

<div class="container">

  <a href="client.html" class="back">
    ← Back to Client Dashboard
  </a>

  <div class="shop-card">

    <h2>🏪 <span id="shopName">Nail Shop</span></h2>

    <p>
      📍 <strong>Location:</strong>
      <span id="shopLocation">Not provided</span>
    </p>

    <p>
      📞 <strong>Phone:</strong>
      <span id="shopPhone">Not provided</span>
    </p>

    <p>
      <strong>About:</strong>
      <span id="shopAbout">Welcome to our nail shop.</span>
    </p>

  </div>

  <input
    id="search"
    class="search"
    type="text"
    placeholder="🔍 Search nail products..."
    oninput="displayProducts()"
  >

  <div id="products">
    <p class="empty">Loading products...</p>
  </div>

  <div class="cart">

    <h2>🛒 My Cart</h2>

    <div id="cartItems">
      <p class="empty">Your cart is empty.</p>
    </div>

    <div id="total" class="total">
      Total: UGX 0
    </div>

    <button
      class="order-button"
      onclick="placeOrder()"
    >
      🛍️ Place Order
    </button>

  </div>

</div>

<script>

let products = [];
let cart = [];


function loadShop() {

  const saved =
    localStorage.getItem("nailUppShop");

  if (!saved) return;

  const shop = JSON.parse(saved);

  document.getElementById("shopName").textContent =
    shop.name || "Nail Shop";

  document.getElementById("shopLocation").textContent =
    shop.location || "Not provided";

  document.getElementById("shopPhone").textContent =
    shop.phone || "Not provided";

  document.getElementById("shopAbout").textContent =
    shop.about || "Welcome to our nail shop.";
}


function loadProducts() {

  const saved =
    localStorage.getItem("nailUppProducts");

  products =
    saved ? JSON.parse(saved) : [];

  displayProducts();
}


function displayProducts() {

  const container =
    document.getElementById("products");

  const search =
    document.getElementById("search").value
      .toLowerCase()
      .trim();

  const filtered =
    products.filter(function(product) {

      return (
        product.name.toLowerCase().includes(search) ||
        product.category.toLowerCase().includes(search)
      );

    });


  if (filtered.length === 0) {

    container.innerHTML =
      '<p class="empty">No products available.</p>';

    return;
  }


  let html = "";


  filtered.forEach(function(product) {

    html +=

      '<div class="product">' +

      '<img class="product-image" src="' +
      product.image +
      '" alt="' +
      product.name +
      '">' +

      '<h3>' +
      product.name +
      '</h3>' +

      '<p><strong>Category:</strong> ' +
      product.category +
      '</p>' +

      '<p>' +
      (product.description || "No description") +
      '</p>' +

      '<p class="price">UGX ' +
      Number(product.price).toLocaleString() +
      '</p>' +

      '<input ' +
      'id="quantity-' + product.id + '" ' +
      'class="quantity" ' +
      'type="number" ' +
      'min="1" ' +
      'value="1">' +

      '<button ' +
      'class="cart-button" ' +
      'onclick="addToCart(' +
      product.id +
      ')">' +
      '🛒 Add to Cart' +
      '</button>' +

      '</div>';

  });


  container.innerHTML = html;
}


function addToCart(productId) {

  const product =
    products.find(function(item) {

      return item.id === productId;

    });


  if (!product) return;


  const quantityInput =
    document.getElementById(
      "quantity-" + productId
    );


  const quantity =
    Number(quantityInput.value);


  if (quantity < 1) {

    alert("Quantity must be at least 1.");

    return;
  }


  const existing =
    cart.find(function(item) {

      return item.id === productId;

    });


  if (existing) {

    existing.quantity += quantity;

  } else {

    cart.push({

      id: product.id,

      name: product.name,

      price: Number(product.price),

      quantity: quantity

    });

  }


  displayCart();

  alert(product.name + " added to cart.");
}


function displayCart() {

  const container =
    document.getElementById("cartItems");

  const totalElement =
    document.getElementById("total");


  if (cart.length === 0) {

    container.innerHTML =
      '<p class="empty">Your cart is empty.</p>';

    totalElement.textContent =
      "Total: UGX 0";

    return;
  }


  let html = "";

  let total = 0;


  cart.forEach(function(item) {

    const itemTotal =
      item.price * item.quantity;

    total += itemTotal;


    html +=

      '<div class="cart-item">' +

      '<strong>' +
      item.name +
      '</strong>' +

      '<p>Quantity: ' +
      item.quantity +
      '</p>' +

      '<p>UGX ' +
      itemTotal.toLocaleString() +
      '</p>' +

      '</div>';

  });


  container.innerHTML = html;

  totalElement.textContent =
    "Total: UGX " +
    total.toLocaleString();
}


function placeOrder() {

  if (cart.length === 0) {

    alert(
      "Please add a product to your cart first."
    );

    return;
  }


  const clientName =
    localStorage.getItem("nailUppName") ||
    "Client";


  const clientPhone =
    localStorage.getItem("nailUppPhone") ||
    "";


  const shop =
    localStorage.getItem("nailUppShop");


  const shopData =
    shop ? JSON.parse(shop) : {};


  const total =
    cart.reduce(function(sum, item) {

      return sum +
        (item.price * item.quantity);

    }, 0);


  const order = {

    id: "ORDER-" + Date.now(),

    clientName: clientName,

    clientPhone: clientPhone,

    shopName: shopData.name || "Nail Shop",

    items: cart,

    total: total,

    status: "Waiting for shop"

  };


  localStorage.setItem(
    "nailUppProductOrder",
    JSON.stringify(order)
  );


  alert(
    "Your order has been submitted!"
  );


  cart = [];

  displayCart();
}


loadShop();

loadProducts();

displayCart();

</script>

</body>
</html>
