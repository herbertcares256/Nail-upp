```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nail Shop Products</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #fff7fb;
  color: #333;
}

header {
  background: #d9165b;
  color: white;
  text-align: center;
  padding: 30px 18px;
  border-radius: 0 0 30px 30px;
}

header h1 {
  font-size: 28px;
}

header p {
  margin-top: 8px;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 20px 15px 50px;
}

.back {
  display: inline-block;
  color: #d9165b;
  font-weight: bold;
  text-decoration: none;
  margin-bottom: 18px;
}

.shop-card,
.product,
.cart {
  background: white;
  border-radius: 20px;
  padding: 20px;
  margin-bottom: 18px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

.shop-card {
  text-align: center;
}

.shop-card h2,
.cart h2 {
  color: #c91b5b;
  margin-bottom: 10px;
}

.shop-card p {
  margin-top: 7px;
  color: #666;
}

.product-image {
  width: 100%;
  height: 210px;
  object-fit: cover;
  border-radius: 15px;
}

.product h3 {
  color: #c91b5b;
  margin-top: 13px;
}

.description {
  color: #666;
  margin-top: 7px;
}

.price {
  font-size: 20px;
  font-weight: bold;
  margin-top: 10px;
}

.stock {
  margin-top: 7px;
}

button {
  width: 100%;
  border: none;
  border-radius: 25px;
  padding: 14px;
  margin-top: 13px;
  background: #d9165b;
  color: white;
  font-size: 16px;
  font-weight: bold;
}

.secondary {
  background: #555;
}

.empty {
  text-align: center;
  color: #777;
  padding: 25px;
}

.cart-item {
  padding: 12px 0;
  border-bottom: 1px solid #eee;
}

.total {
  font-size: 20px;
  font-weight: bold;
  color: #c91b5b;
  margin-top: 15px;
}
</style>
</head>

<body>

<header>
  <h1>🛍️ Nail Shop</h1>
  <p id="shopHeader">Products</p>
</header>

<div class="container">

  <a href="shops.html" class="back">
    ← Back to Nail Shops
  </a>

  <div class="shop-card" id="shopInfo">
    Loading shop...
  </div>

  <div id="productList">
    <div class="empty">
      Loading products...
    </div>
  </div>

  <div class="cart">

    <h2>🛒 My Cart</h2>

    <div id="cartItems">
      <div class="empty">
        Your cart is empty.
      </div>
    </div>

    <div class="total" id="cartTotal">
      Total: UGX 0
    </div>

    <button onclick="checkout()">
      🛍️ Order Products
    </button>

  </div>

  <button class="secondary" onclick="goBack()">
    ← Back to Shops
  </button>

</div>


<script>

/* SELECTED SHOP */

const savedShop =
  localStorage.getItem(
    "selectedNailUppShop"
  );

if (!savedShop) {

  alert(
    "Please select a nail shop first."
  );

  window.location.href =
    "shops.html";

}

const selectedShop =
  JSON.parse(savedShop);


/* SHOP INFORMATION */

document.getElementById(
  "shopHeader"
).textContent =
  selectedShop.name || "Nail Shop";


document.getElementById(
  "shopInfo"
).innerHTML =

  "<h2>🏪 " +
  escapeHTML(
    selectedShop.name || "Nail Shop"
  ) +
  "</h2>" +

  "<p>📍 " +
  escapeHTML(
    selectedShop.location ||
    "Location not provided"
  ) +
  "</p>" +

  "<p>📞 " +
  escapeHTML(
    selectedShop.phone ||
    "Phone not provided"
  ) +
  "</p>";


/* CART */

let cartItems = [];


/* LOAD PRODUCTS */

function loadProducts() {

  const saved =
    localStorage.getItem(
      "nailUppProducts"
    );

  const products =
    saved
      ? JSON.parse(saved)
      : [];

  const shopProducts =
    products.filter(
      function(product) {

        return (
          product.shopId ===
          selectedShop.id
        );

      }
    );

  const list =
    document.getElementById(
      "productList"
    );


  if (
    shopProducts.length === 0
  ) {

    list.innerHTML =

      '<div class="empty">' +
      '<h3>No Products Yet</h3>' +
      '<p>This shop has not added products yet.</p>' +
      '</div>';

    return;

  }


  let html = "";


  shopProducts.forEach(
    function(product) {

      const stock =
        Number(product.stock);


      html +=

        '<div class="product">' +

        '<img class="product-image" ' +
        'src="' +
        product.image +
        '" alt="Product">' +

        '<h3>' +
        escapeHTML(product.name) +
        '</h3>' +

        '<p class="description">' +
        escapeHTML(
          product.description ||
          "No description available."
        ) +
        '</p>' +

        '<p class="price">' +
        'UGX ' +
        Number(product.price)
          .toLocaleString() +
        '</p>' +

        '<p class="stock">' +
        '📦 Stock: ' +
        stock +
        '</p>' +

        (
          stock > 0

          ?

          '<button onclick="addToCart(\'' +
          product.id +
          '\')">' +
          '🛒 Add to Cart' +
          '</button>'

          :

          '<button disabled ' +
          'style="background:#999">' +
          'Out of Stock' +
          '</button>'
        ) +

        '</div>';

    }
  );


  list.innerHTML =
    html;

}


/* ADD TO CART */

function addToCart(productId) {

  const saved =
    localStorage.getItem(
      "nailUppProducts"
    );

  const products =
    saved
      ? JSON.parse(saved)
      : [];

  const product =
    products.find(
      function(item) {

        return (
          item.id ===
          productId
        );

      }
    );


  if (!product) {

    alert(
      "Product not found."
    );

    return;

  }


  const existing =
    cartItems.find(
      function(item) {

        return (
          item.id ===
          productId
        );

      }
    );


  if (existing) {

    if (
      existing.quantity <
      Number(product.stock)
    ) {

      existing.quantity++;

    } else {

      alert(
        "You cannot order more than the available stock."
      );

    }

  } else {

    cartItems.push({

      id:
        product.id,

      name:
        product.name,

      price:
        Number(product.price),

      quantity:
        1

    });

  }


  updateCart();

}


/* UPDATE CART */

function updateCart() {

  const container =
    document.getElementById(
      "cartItems"
    );


  if (
    cartItems.length === 0
  ) {

    container.innerHTML =
      '<div class="empty">' +
      'Your cart is empty.' +
      '</div>';

    document.getElementById(
      "cartTotal"
    ).textContent =
      "Total: UGX 0";

    return;

  }


  let html = "";
  let total = 0;


  cartItems.forEach(
    function(item) {

      const subtotal =
        item.price *
        item.quantity;

      total += subtotal;


      html +=

        '<div class="cart-item">' +

        '<strong>' +
        escapeHTML(item.name) +
        '</strong>' +

        '<br>' +

        'Quantity: ' +
        item.quantity +

        '<br>' +

        'Subtotal: UGX ' +
        subtotal.toLocaleString() +

        '<button ' +
        'onclick="removeFromCart(\'' +
        item.id +
        '\')" ' +
        'style="background:#777">' +

        'Remove' +

        '</button>' +

        '</div>';

    }
  );


  container.innerHTML =
    html;


  document.getElementById(
    "cartTotal"
  ).textContent =
    "Total: UGX " +
    total.toLocaleString();

}


/* REMOVE ITEM */

function removeFromCart(productId) {

  cartItems =
    cartItems.filter(
      function(item) {

        return (
          item.id !==
          productId
        );

      }
    );

  updateCart();

}


/* PLACE ORDER */

function checkout() {

  if (
    cartItems.length === 0
  ) {

    alert(
      "Please add a product to your cart first."
    );

    return;

  }


  const customerName =
    prompt(
      "Enter your name:"
    );


  if (!customerName) {

    return;

  }


  const customerPhone =
    prompt(
      "Enter your phone number:"
    );


  if (!customerPhone) {

    return;

  }


  let total = 0;


  cartItems.forEach(
    function(item) {

      total +=
        item.price *
        item.quantity;

    }
  );


  const order = {

    id:
      "ORD-" +
      Date.now(),

    shopId:
      selectedShop.id,

    shopName:
      selectedShop.name,

    customerName:
      customerName,

    customerPhone:
      customerPhone,

    items:
      cartItems,

    total:
      total,

    date:
      new Date().toLocaleString(),

    status:
      "Pending"

  };


  const saved =
    localStorage.getItem(
      "nailUppProductOrders"
    );


  const orders =
    saved
      ? JSON.parse(saved)
      : [];


  orders.push(order);


  localStorage.setItem(
    "nailUppProductOrders",
    JSON.stringify(orders)
  );


  alert(
    "✅ Order placed successfully!\n\n" +
    "Order Number: " +
    order.id +
    "\n" +
    "Total: UGX " +
    total.toLocaleString()
  );


  cartItems = [];

  updateCart();

}


/* ESCAPE TEXT */

function escapeHTML(text) {

  return String(text)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* BACK */

function goBack() {

  window.location.href =
    "shops.html";

}


/* START */

loadProducts();

updateCart();

</script>

</body>
</html>
