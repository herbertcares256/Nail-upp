<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nail Upp - Parlor</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #fff7fb;
      color: #333;
    }

    header {
      background: #d81b60;
      color: white;
      text-align: center;
      padding: 25px 15px;
      border-radius: 0 0 25px 25px;
    }

    header h1 {
      font-size: 28px;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 20px 15px 40px;
    }

    .card {
      background: white;
      padding: 20px;
      margin-bottom: 18px;
      border-radius: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h2 {
      color: #d81b60;
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-top: 12px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
    }

    textarea {
      min-height: 80px;
    }

    button {
      border: none;
      border-radius: 22px;
      padding: 12px;
      font-size: 14px;
      font-weight: bold;
    }

    .save {
      width: 100%;
      margin-top: 20px;
      background: #d81b60;
      color: white;
    }

    .booking {
      border: 1px solid #eee;
      border-radius: 14px;
      padding: 15px;
      margin-top: 12px;
    }

    .booking p {
      margin: 7px 0;
      font-size: 14px;
    }

    .status {
      margin-top: 12px;
      padding: 10px;
      border-radius: 9px;
      text-align: center;
      font-weight: bold;
      background: #fff0f6;
      color: #d81b60;
    }

    .accepted {
      background: #e8f5e9;
      color: #2e7d32;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .accept {
      flex: 1;
      background: #2e7d32;
      color: white;
    }

    .decline {
      flex: 1;
      background: #c62828;
      color: white;
    }

    .logout {
      width: 100%;
      background: #333;
      color: white;
      margin-top: 5px;
    }

    .empty {
      color: #777;
      text-align: center;
      padding: 12px;
    }
  </style>
</head>

<body>

<header>
  <h1>💅 Nail Upp</h1>
  <p>Nail Parlor Dashboard</p>
</header>

<div class="container">

  <div class="card">

    <h2>🏪 My Parlor</h2>

    <p>
      <strong>Name:</strong>
      <span id="showName">Not set</span>
    </p>

    <p style="margin-top:8px;">
      <strong>Location:</strong>
      <span id="showLocation">Not set</span>
    </p>

    <p style="margin-top:8px;">
      <strong>Phone:</strong>
      <span id="showPhone">Not set</span>
    </p>

  </div>


  <div class="card">

    <h2>📅 Customer Bookings</h2>

    <div id="bookings">
      <p class="empty">No bookings yet.</p>
    </div>

  </div>


  <div class="card">

    <h2>✏️ Update Parlor</h2>

    <label>Parlor Name</label>
    <input id="parlorName" type="text">

    <label>Location</label>
    <input id="parlorLocation" type="text">

    <label>Phone</label>
    <input id="parlorPhone" type="tel">

    <label>About</label>
    <textarea id="parlorAbout"></textarea>

    <button class="save" onclick="saveParlor()">
      Save Changes
    </button>

  </div>


  <button class="logout" onclick="logout()">
    Log Out
  </button>

</div>

<script>

function loadParlor() {

  const saved =
    localStorage.getItem("nailUppParlor");

  if (!saved) return;

  const parlor = JSON.parse(saved);

  document.getElementById("showName").textContent =
    parlor.name || "Not set";

  document.getElementById("showLocation").textContent =
    parlor.location || "Not set";

  document.getElementById("showPhone").textContent =
    parlor.phone || "Not set";

  document.getElementById("parlorName").value =
    parlor.name || "";

  document.getElementById("parlorLocation").value =
    parlor.location || "";

  document.getElementById("parlorPhone").value =
    parlor.phone || "";

  document.getElementById("parlorAbout").value =
    parlor.about || "";
}


function saveParlor() {

  const saved =
    localStorage.getItem("nailUppParlor");

  let parlor = saved
    ? JSON.parse(saved)
    : {};

  parlor.name =
    document.getElementById("parlorName").value.trim();

  parlor.location =
    document.getElementById("parlorLocation").value.trim();

  parlor.phone =
    document.getElementById("parlorPhone").value.trim();

  parlor.about =
    document.getElementById("parlorAbout").value.trim();

  localStorage.setItem(
    "nailUppParlor",
    JSON.stringify(parlor)
  );

  loadParlor();

  alert("Parlor information saved.");
}


function loadBookings() {

  const saved =
    localStorage.getItem("nailUppParlorBooking");

  const bookings =
    document.getElementById("bookings");

  if (!saved) {

    bookings.innerHTML =
      '<p class="empty">No bookings yet.</p>';

    return;
  }

  const booking = JSON.parse(saved);

  let statusClass = "status";

  if (booking.status === "Accepted by parlor") {
    statusClass = "status accepted";
  }

  let buttons = "";

  if (booking.status === "Waiting for parlor") {

    buttons =
      '<div class="buttons">' +

      '<button class="accept" onclick="acceptBooking()">' +
      '✅ Accept' +
      '</button>' +

      '<button class="decline" onclick="declineBooking()">' +
      '❌ Decline' +
      '</button>' +

      '</div>';

  } else if (booking.status === "Accepted by parlor") {

    buttons =
      '<p style="text-align:center;margin-top:12px;color:#2e7d32;font-weight:bold;">' +
      'Booking accepted successfully.' +
      '</p>';

  } else if (booking.status === "Declined by parlor") {

    buttons =
      '<p style="text-align:center;margin-top:12px;color:#c62828;font-weight:bold;">' +
      'Booking declined.' +
      '</p>';
  }


  bookings.innerHTML =

    '<div class="booking">' +

    '<p><strong>Client:</strong> ' +
    booking.clientName + '</p>' +

    '<p><strong>Phone:</strong> ' +
    booking.clientPhone + '</p>' +

    '<p><strong>Service:</strong> ' +
    booking.service + '</p>' +

    '<p><strong>Date:</strong> ' +
    booking.date + '</p>' +

    '<p><strong>Time:</strong> ' +
    booking.time + '</p>' +

    '<p><strong>Instructions:</strong> ' +
    (booking.instructions || "None") + '</p>' +

    '<div class="' + statusClass + '">' +
    'STATUS: ' + booking.status +
    '</div>' +

    buttons +

    '</div>';
}


function acceptBooking() {

  const saved =
    localStorage.getItem("nailUppParlorBooking");

  if (!saved) return;

  const booking = JSON.parse(saved);

  booking.status = "Accepted by parlor";

  localStorage.setItem(
    "nailUppParlorBooking",
    JSON.stringify(booking)
  );

  loadBookings();
}


function declineBooking() {

  const saved =
    localStorage.getItem("nailUppParlorBooking");

  if (!saved) return;

  const booking = JSON.parse(saved);

  booking.status = "Declined by parlor";

  localStorage.setItem(
    "nailUppParlorBooking",
    JSON.stringify(booking)
  );

  loadBookings();
}


function logout() {

  localStorage.removeItem("nailUppParlor");

  window.location.href = "index.html";
}


loadParlor();
loadBookings();

</script>

</body>
</html>
